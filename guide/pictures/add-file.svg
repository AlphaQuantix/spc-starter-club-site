<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title>Drawing: the Add file button and its menu, with Create new file at the top</title>
  <rect x="0" y="0" width="720" height="210" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="20" y="16" width="110" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="34" y="38" fill="#1f2328">&lt;&gt; Code</text>
  <rect x="440" y="16" width="120" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="454" y="38" fill="#1f2328">Add file  &#9662;</text>
  <rect x="570" y="16" width="130" height="34" rx="6" fill="#1f883d"/>
