<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title>Drawing: the green Use this template button at the top of the repository page</title>
  <rect x="0" y="0" width="720" height="200" fill="#ffffff" stroke="#d0d7de"/>
  <text x="20" y="36" font-size="18" fill="#0969da">AlphaQuantix / <tspan font-weight="bold">spc-starter-club-site</tspan></text>
  <rect x="400" y="18" width="70" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/>
  <text x="414" y="36" font-size="13" fill="#57606a">Public</text>
  <rect x="440" y="62" width="250" height="34" rx="6" fill="#1f883d"/>
  <text x="458" y="84" fill="#ffffff" font-weight="bold">Use this template  &#9662;</text>
  <rect x="440" y="100" width="250" height="78" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="456" y="128" fill="#1f2328">Create a new repository</text>
  <text x="456" y="162" fill="#57606a">Open in a codespace</text>
  <rect x="432" y="56" width="266" height="80" rx="10" fill="none" stroke="#cf222e" stroke-width="4"/>
  <rect x="20" y="62" width="110" height="34" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="34" y="84" fill="#1f2328">&lt;&gt; Code</text>
  <text x="20" y="150" fill="#cf222e" font-weight="bold">1. Click Use this template</text>
  <text x="20" y="176" fill="#cf222e" font-weight="bold">2. Click Create a new repository</text>
</svg>
