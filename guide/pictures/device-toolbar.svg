<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title>Drawing: Chrome with the Inspect panel open, the Toggle device toolbar icon, and the width set to 360</title>
  <rect x="0" y="0" width="720" height="300" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="0" y="0" width="420" height="40" fill="#f1f3f4"/>
  <text x="16" y="26" fill="#3c4043">Dimensions: Responsive &#9662;</text>
  <rect x="226" y="10" width="54" height="22" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
  <text x="236" y="26" fill="#1f2328">360</text>
  <text x="288" y="26" fill="#3c4043">&#215;</text>
  <rect x="304" y="10" width="54" height="22" fill="#ffffff" stroke="#dadce0"/>
  <text x="314" y="26" fill="#3c4043">740</text>
  <rect x="220" y="4" width="66" height="34" rx="6" fill="none" stroke="#cf222e" stroke-width="4"/>
  <rect x="150" y="56" width="120" height="230" rx="10" fill="#ffffff" stroke="#3c4043" stroke-width="2"/>
  <rect x="160" y="70" width="100" height="18" fill="#1d4e89"/>
  <rect x="160" y="100" width="100" height="40" fill="#e9eef5"/>
  <rect x="160" y="148" width="100" height="40" fill="#e9eef5"/>
  <rect x="160" y="196" width="100" height="40" fill="#e9eef5"/>
  <text x="168" y="258" font-size="12" fill="#3c4043">Cards in one column</text>
  <rect x="420" y="0" width="300" height="300" fill="#ffffff" stroke="#dadce0"/>
  <rect x="420" y="0" width="300" height="40" fill="#f1f3f4" stroke="#dadce0"/>
  <path d="M432 12 h10 v16 h-10 z M436 10 v0" fill="none" stroke="#1a73e8" stroke-width="2"/>
  <path d="M446 16 h14 v12 h-14 z" fill="none" stroke="#1a73e8" stroke-width="2"/>
  <rect x="424" y="4" width="42" height="32" rx="6" fill="none" stroke="#cf222e" stroke-width="4"/>
  <text x="478" y="26" fill="#3c4043">Elements   Console</text>
  <text x="440" y="80" fill="#cf222e" font-weight="bold">1. Click the phone-and-tablet</text>
  <text x="440" y="100" fill="#cf222e" font-weight="bold">   icon (Toggle device toolbar)</text>
  <text x="440" y="140" fill="#cf222e" font-weight="bold">2. Pick Responsive</text>
  <text x="440" y="180" fill="#cf222e" font-weight="bold">3. Type 360 in the width box</text>
  <text x="440" y="200" fill="#cf222e" font-weight="bold">   and press Enter</text>
</svg>
