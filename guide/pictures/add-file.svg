  <rect x="434" y="10" width="132" height="46" rx="8" fill="none" stroke="#cf222e" stroke-width="4"/>
  <rect x="384" y="64" width="212" height="34" rx="6" fill="none" stroke="#cf222e" stroke-width="4"/>
  <text x="20" y="90" fill="#1f2328">README.md</text>
  <text x="20" y="116" fill="#1f2328">index.html</text>
  <text x="20" y="142" fill="#1f2328">style.css</text>
  <text x="20" y="186" fill="#cf222e" font-weight="bold">1. Click Add file. 2. Click Create new file.</text>
